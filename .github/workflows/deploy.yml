name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or master, depending on your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          # Copy only the files needed for Trailer and Viral modes
          cp index.html deploy/
          cp styles.css deploy/
          cp script.js deploy/
          cp trailer-mode.js deploy/
          cp viral-mode.js deploy/
          cp sw-deploy.js deploy/sw.js
          cp manifest.json deploy/
          cp icon-192.png deploy/ 2>/dev/null || true
          cp icon-512.png deploy/ 2>/dev/null || true
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

